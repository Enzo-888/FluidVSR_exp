model:
  name: 'EDSR'
  in_channels: 1
  out_channels: 1
  hidden_channels: 128
  n_res_blocks: 16
  upscale_factor: 4

data:
  name: 'ShallowWater'
  hr_path: '/data/yc/dataset/RB/code/shallow-water-32/data1/HR'
  lr_path: '/data/yc/dataset/RB/code/shallow-water-32/data1/LR'
  num_samples: 200
  sample_factor: 4
  shape: [128, 128]
  use_input_frame: False
  train_batchsize: 320
  eval_batchsize: 320
  train_ratio: 0.8
  valid_ratio: 0.1
  test_ratio: 0.1
  normalize: True
  normalizer_type: 'PGN'

train:
  random_seed: 42
  cuda: True
  device: 0
  epochs: 500
  patience: 10
  eval_freq: 5
  saving_best: True
  load_ckpt: False
  saving_ckpt: True
  ckpt_freq: 5
  ckpt_max: 5
  distribute: False
  distribute_mode: 'DDP'
  device_ids: [0, 1, 2, 3]

optimize:
  optimizer: 'AdamW'
  lr: 0.001
  weight_decay: 0.001

schedule:
  scheduler: 'StepLR'
  step_size: 300
  gamma: 0.5

log:
  verbose: True
  log: True
  log_dir: '/data/yc/Fluid_VSR/logs/ShallowWater/EDSR'
  wandb: True
  wandb_project: 'DiffVSR-EDSR-ShallowWater'
