model:
  name: 'FNO2d'
  modes1: [15, 12, 9, 9, 9]
  modes2: [15, 12, 9, 9, 9]
  width: 64
  fc_dim: 128
  layers: [16, 24, 24, 32, 32]
  in_dim: 1
  out_dim: 1
  act: 'gelu'
  pos_dim: 2
  upsample_factor: [4, 4]

data:
  name: 'ERA5V'
  hr_path: '/data/yc/dataset/era5_wind_200hPa_daily_cut/HR'
  lr_path: '/data/yc/dataset/era5_wind_200hPa_daily_cut/LR'
  num_samples: 578
  sample_factor: 4
  shape: [256, 256]
  use_input_frame: False
  train_batchsize: 100
  eval_batchsize: 100
  train_ratio: 0.98
  valid_ratio: 0.01
  test_ratio: 0.01
  normalize: True
  normalizer_type: 'PGN'

train:
  random_seed: 42
  cuda: True
  device: 0
  epochs: 500
  patience: 10
  eval_freq: 5
  saving_best: True
  load_ckpt: False
  saving_ckpt: True
  ckpt_freq: 5
  ckpt_max: 5
  distribute: False
  distribute_mode: 'DDP'
  device_ids: [0, 1, 2, 3]

optimize:
  optimizer: 'AdamW'
  lr: 0.001
  weight_decay: 0.001

schedule:
  scheduler: 'StepLR'
  step_size: 300
  gamma: 0.5

log:
  verbose: True
  log: True
  log_dir: '/data/yc/Fluid_VSR/logs/ERA5V/FNO'
  wandb: True
  wandb_project: 'DiffVSR-FNO2d-ERA5V'
